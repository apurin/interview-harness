<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Atlas product interview</title>
  </head>
  <body>
    <script src="../interview-harness.js"></script>
    <script>
      const wireframeStyle = `
        <style>
          * { box-sizing: border-box; }
          body { margin: 0; padding: 16px; background: #eef0f2; color: #20252b; font: 12px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
          .frame { overflow: hidden; height: 244px; border: 1px solid #cfd4da; border-radius: 10px; background: #fff; box-shadow: 0 10px 28px rgba(25, 32, 40, .08); }
          .toolbar { display: flex; align-items: center; justify-content: space-between; height: 34px; padding: 0 10px; border-bottom: 1px solid #dfe3e7; background: #f8f9fa; }
          .brand { font-weight: 750; }
          .actions { display: flex; gap: 5px; }
          .dot { width: 7px; height: 7px; border-radius: 50%; background: #b9c0c8; }
          .dot.accent { background: #55b894; }
          .line { height: 7px; border-radius: 999px; background: #d9dde2; }
          .line.dark { background: #919aa4; }
          .line.accent { background: #77c9ab; }
          .w25 { width: 25%; } .w35 { width: 35%; } .w45 { width: 45%; } .w60 { width: 60%; } .w75 { width: 75%; } .w90 { width: 90%; }
          .three { display: grid; grid-template-columns: 62px 102px 1fr; height: 210px; }
          .nav { padding: 10px 8px; border-right: 1px solid #e0e4e8; background: #f6f7f8; }
          .nav .block { height: 28px; margin-bottom: 7px; border-radius: 6px; background: #e3e6ea; }
          .nav .block.active { background: #d6f1e7; border: 1px solid #83cdb3; }
          .list { padding: 10px 8px; border-right: 1px solid #e0e4e8; }
          .list .card { margin-bottom: 7px; padding: 8px; border: 1px solid #dce1e5; border-radius: 7px; }
          .list .card.active { border-color: #63bd9d; box-shadow: 0 0 0 1px #63bd9d inset; }
          .card .line + .line { margin-top: 6px; }
          .document { padding: 14px; }
          .document h2 { margin: 0 0 10px; font-size: 15px; }
          .document .line { margin-bottom: 7px; }
          .quote { margin-top: 12px; padding: 10px; border-left: 3px solid #63bd9d; background: #f1f8f5; }
          .canvas-layout { display: grid; grid-template-columns: 1fr 112px; height: 210px; }
          .canvas { position: relative; overflow: hidden; background: linear-gradient(#f1f3f5 1px, transparent 1px), linear-gradient(90deg, #f1f3f5 1px, transparent 1px); background-size: 18px 18px; }
          .node { position: absolute; width: 80px; padding: 9px; border: 1px solid #cdd3d9; border-radius: 8px; background: white; box-shadow: 0 5px 12px rgba(25, 32, 40, .08); }
          .node.a { left: 25px; top: 38px; } .node.b { left: 132px; top: 86px; border-color: #63bd9d; } .node.c { left: 240px; top: 35px; }
          .connector { position: absolute; height: 2px; transform-origin: left center; background: #aeb6bf; }
          .connector.ab { left: 98px; top: 75px; width: 72px; transform: rotate(25deg); }
          .connector.bc { left: 205px; top: 105px; width: 80px; transform: rotate(-30deg); }
          .inspector { padding: 11px; border-left: 1px solid #dfe3e7; background: #fafbfb; }
          .inspector strong { display: block; margin-bottom: 12px; }
          .field { height: 24px; margin-bottom: 8px; border: 1px solid #d8dde2; border-radius: 5px; background: white; }
          .focus-layout { display: grid; grid-template-columns: 54px 1fr; height: 210px; }
          .rail { padding: 10px 8px; border-right: 1px solid #e0e4e8; background: #f6f7f8; }
          .rail .icon { width: 28px; height: 28px; margin: 0 auto 9px; border-radius: 7px; background: #dfe3e7; }
          .rail .icon.active { background: #ccecdf; }
          .focus-doc { position: relative; padding: 14px 24px; }
          .focus-doc h2 { margin: 0 0 12px; font-size: 16px; }
          .focus-doc .line { margin-bottom: 8px; }
          .command { position: absolute; right: 24px; bottom: 15px; left: 24px; display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border: 1px solid #cfd5db; border-radius: 8px; background: #fbfcfc; box-shadow: 0 8px 18px rgba(25, 32, 40, .08); }
          .key { padding: 2px 5px; border-radius: 4px; background: #e5e8eb; color: #68717b; font-size: 10px; }
        </style>`;

      const escapeAttribute = (value) => value.replaceAll("&", "&amp;").replaceAll('"', "&quot;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
      const framePreview = (title, content) => `<iframe title="${title}" style="display:block;width:100%;height:276px;border:0;border-radius:8px" srcdoc="${escapeAttribute(wireframeStyle + content)}"></iframe>`;
      const roadmapPreview = (label, drawing) => `<div style="width:100%;max-width:320px;margin-top:8px"><svg viewBox="0 0 320 150" role="img" aria-label="${label}" style="display:block;width:100%;height:auto;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><rect x="1" y="1" width="318" height="148" rx="10" fill="#f8fafb" stroke="#cbd4d9"/><rect x="1" y="1" width="318" height="28" rx="10" fill="#eef2f3"/><path d="M1 28h318" stroke="#cbd4d9"/><circle cx="15" cy="14" r="3" fill="#49ad86"/><circle cx="25" cy="14" r="3" fill="#b8c1c5"/>${drawing}</svg></div>`;

      const roadmapPreviews = {
        inbox: roadmapPreview("Unified source inbox preview", `<text x="42" y="18" fill="#20282d" font-size="9" font-weight="700">Source inbox</text><rect x="263" y="8" width="42" height="13" rx="6" fill="#dff3eb"/><text x="284" y="17" text-anchor="middle" fill="#26785d" font-size="7">Import</text><rect x="12" y="39" width="296" height="28" rx="6" fill="#ffffff" stroke="#d5dce0"/><rect x="21" y="47" width="28" height="12" rx="3" fill="#edf1f2"/><text x="35" y="56" text-anchor="middle" fill="#69757b" font-size="7">PDF</text><text x="59" y="50" fill="#20282d" font-size="8" font-weight="700">Q2 customer interviews</text><text x="59" y="60" fill="#69757b" font-size="7">28 pages · OCR complete</text><rect x="266" y="47" width="31" height="12" rx="6" fill="#dff3eb"/><text x="281.5" y="56" text-anchor="middle" fill="#26785d" font-size="7">Ready</text><rect x="12" y="74" width="296" height="28" rx="6" fill="#ffffff" stroke="#d5dce0"/><rect x="21" y="82" width="28" height="12" rx="3" fill="#edf1f2"/><text x="35" y="91" text-anchor="middle" fill="#69757b" font-size="7">WEB</text><text x="59" y="85" fill="#20282d" font-size="8" font-weight="700">Competitor pricing update</text><text x="59" y="95" fill="#69757b" font-size="7">Saved today · 14 highlights</text><rect x="266" y="82" width="31" height="12" rx="6" fill="#fff1c9"/><text x="281.5" y="91" text-anchor="middle" fill="#88620f" font-size="7">Review</text><rect x="12" y="109" width="296" height="28" rx="6" fill="#ffffff" stroke="#d5dce0"/><rect x="21" y="117" width="28" height="12" rx="3" fill="#edf1f2"/><text x="35" y="126" text-anchor="middle" fill="#69757b" font-size="7">NOTE</text><text x="59" y="120" fill="#20282d" font-size="8" font-weight="700">Sales debrief — Acme</text><text x="59" y="130" fill="#69757b" font-size="7">Transcript linked · 6 claims</text>`),
        evidence: roadmapPreview("Evidence board preview", `<text x="42" y="18" fill="#20282d" font-size="9" font-weight="700">Evidence board · Expansion risk</text><text x="18" y="44" fill="#69757b" font-size="7" font-weight="700">SIGNALS</text><text x="116" y="44" fill="#69757b" font-size="7" font-weight="700">DRIVERS</text><text x="214" y="44" fill="#69757b" font-size="7" font-weight="700">RISKS</text><rect x="12" y="50" width="90" height="34" rx="5" fill="#ffffff" stroke="#d5dce0"/><text x="20" y="63" fill="#20282d" font-size="7.5">Renewal objections</text><text x="20" y="75" fill="#69757b" font-size="6.5">4 cited passages</text><rect x="110" y="50" width="90" height="34" rx="5" fill="#ffffff" stroke="#49ad86"/><text x="118" y="63" fill="#20282d" font-size="7.5">Admin overhead</text><text x="118" y="75" fill="#69757b" font-size="6.5">Strong evidence</text><rect x="208" y="50" width="100" height="34" rx="5" fill="#ffffff" stroke="#d5dce0"/><text x="216" y="63" fill="#20282d" font-size="7.5">Seat contraction</text><text x="216" y="75" fill="#69757b" font-size="6.5">Needs validation</text><path d="M102 67h8M200 67h8" stroke="#49ad86" stroke-width="1.5"/><rect x="12" y="93" width="90" height="34" rx="5" fill="#ffffff" stroke="#d5dce0"/><text x="20" y="106" fill="#20282d" font-size="7.5">Usage plateau</text><text x="20" y="118" fill="#69757b" font-size="6.5">2 cited passages</text><rect x="110" y="93" width="90" height="34" rx="5" fill="#ffffff" stroke="#d5dce0"/><text x="118" y="106" fill="#20282d" font-size="7.5">Weak onboarding</text><text x="118" y="118" fill="#69757b" font-size="6.5">Moderate evidence</text><path d="M102 110h8" stroke="#697671" stroke-width="1.5"/>`),
        brief: roadmapPreview("Citation-backed brief preview", `<text x="42" y="18" fill="#20282d" font-size="9" font-weight="700">Market brief · Draft 3</text><rect x="12" y="38" width="70" height="99" rx="6" fill="#ffffff"/><text x="21" y="53" fill="#69757b" font-size="7">OUTLINE</text><rect x="20" y="62" width="52" height="14" rx="3" fill="#dff3eb"/><text x="26" y="71" fill="#26785d" font-size="6.5">Summary</text><text x="21" y="89" fill="#69757b" font-size="6.5">Market shift</text><text x="21" y="105" fill="#69757b" font-size="6.5">Evidence</text><text x="21" y="121" fill="#69757b" font-size="6.5">Recommendation</text><rect x="91" y="38" width="217" height="99" rx="6" fill="#ffffff"/><text x="105" y="56" fill="#20282d" font-size="10" font-weight="700">Expansion is slowing in mid-market</text><rect x="105" y="66" width="177" height="4" rx="2" fill="#c6ced2"/><rect x="105" y="75" width="155" height="4" rx="2" fill="#c6ced2"/><rect x="105" y="84" width="183" height="4" rx="2" fill="#c6ced2"/><rect x="105" y="97" width="74" height="16" rx="8" fill="#dff3eb"/><text x="142" y="107" text-anchor="middle" fill="#26785d" font-size="6.5">3 supporting sources</text><rect x="105" y="120" width="126" height="4" rx="2" fill="#c6ced2"/><rect x="237" y="116" width="56" height="13" rx="4" fill="#edf1f2"/><text x="265" y="125" text-anchor="middle" fill="#69757b" font-size="6.5">Add citation</text>`),
        review: roadmapPreview("Review queue preview", `<text x="42" y="18" fill="#20282d" font-size="9" font-weight="700">Review queue</text><rect x="12" y="39" width="202" height="43" rx="6" fill="#ffffff" stroke="#49ad86"/><text x="23" y="54" fill="#20282d" font-size="8" font-weight="700">Market expansion brief</text><text x="23" y="67" fill="#69757b" font-size="6.5">Maya · 5 unresolved comments</text><rect x="164" y="50" width="39" height="14" rx="7" fill="#fff1c9"/><text x="183.5" y="59.5" text-anchor="middle" fill="#88620f" font-size="6.5">Changes</text><rect x="12" y="90" width="202" height="43" rx="6" fill="#ffffff" stroke="#d5dce0"/><text x="23" y="105" fill="#20282d" font-size="8" font-weight="700">Partner landscape</text><text x="23" y="118" fill="#69757b" font-size="6.5">Jon · ready for approval</text><rect x="164" y="101" width="39" height="14" rx="7" fill="#dff3eb"/><text x="183.5" y="110.5" text-anchor="middle" fill="#26785d" font-size="6.5">Approve</text><rect x="225" y="39" width="83" height="94" rx="6" fill="#ffffff"/><text x="237" y="54" fill="#69757b" font-size="6.5">REVIEWERS</text><circle cx="242" cy="70" r="7" fill="#d5dce0"/><circle cx="260" cy="70" r="7" fill="#dff3eb"/><circle cx="278" cy="70" r="7" fill="#eadccf"/><text x="237" y="94" fill="#20282d" font-size="7">2 due today</text><text x="237" y="108" fill="#69757b" font-size="6.5">Median: 18h</text>`)
      };

      InterviewHarness.mount({
        title: "Shape the Atlas desktop beta",
        markdownIntro: "Review the **workspace layout**, desktop stack, release sequence, and customer journey before implementation continues.",
        questions: [
          {
            type: "choice",
            prompt: "Which layout should organize the research workspace?",
            cards: [
              {
                title: "Three-pane workspace",
                tags: ["Recommended", "Fast scanning"],
                markdown: "Keep the library, source list, and active synthesis visible for fast cross-reference.",
                markdownTooltip: "Keeps the library, source list, and active synthesis visible at the same time.",
                htmlPreview: framePreview("Library, sources, and document", `<div class="frame"><div class="toolbar"><span class="brand">Atlas</span><span class="actions"><i class="dot"></i><i class="dot accent"></i><i class="dot"></i></span></div><div class="three"><aside class="nav"><div class="block active"></div><div class="block"></div><div class="block"></div><div class="block"></div></aside><section class="list"><div class="card active"><div class="line dark w75"></div><div class="line w90"></div></div><div class="card"><div class="line dark w60"></div><div class="line w75"></div></div><div class="card"><div class="line dark w90"></div><div class="line w45"></div></div></section><main class="document"><h2>Interview synthesis</h2><div class="line dark w45"></div><div class="line w90"></div><div class="line w75"></div><div class="line w90"></div><div class="quote"><div class="line accent w60"></div><div class="line w90"></div></div></main></div></div>`)
              },
              {
                title: "Canvas + inspector",
                tags: ["Spatial", "Flexible"],
                markdown: "Arrange findings spatially while editing the selected item in a contextual inspector.",
                markdownTooltip: "Best when spatial relationships are central to the work.",
                htmlPreview: framePreview("Visual canvas with contextual controls", `<div class="frame"><div class="toolbar"><span class="brand">Atlas</span><span class="actions"><i class="dot"></i><i class="dot accent"></i><i class="dot"></i></span></div><div class="canvas-layout"><main class="canvas"><i class="connector ab"></i><i class="connector bc"></i><div class="node a"><div class="line dark w75"></div><div class="line w90"></div></div><div class="node b"><div class="line accent w60"></div><div class="line w90"></div></div><div class="node c"><div class="line dark w45"></div><div class="line w75"></div></div></main><aside class="inspector"><strong>Inspector</strong><div class="field"></div><div class="field"></div><div class="line w75"></div><div class="line w45"></div></aside></div></div>`)
              },
              {
                title: "Focused document",
                tags: ["Low distraction"],
                markdown: "Center one document with a compact navigation rail and command-driven access to everything else.",
                htmlPreview: framePreview("Document-first workspace", `<div class="frame"><div class="toolbar"><span class="brand">Atlas</span><span class="actions"><i class="dot"></i><i class="dot accent"></i><i class="dot"></i></span></div><div class="focus-layout"><aside class="rail"><div class="icon active"></div><div class="icon"></div><div class="icon"></div><div class="icon"></div></aside><main class="focus-doc"><h2>Market landscape</h2><div class="line dark w35"></div><div class="line w90"></div><div class="line w75"></div><div class="line w90"></div><div class="line w60"></div><div class="command"><span>Ask Atlas or add a source…</span><span class="key">⌘ K</span></div></main></div></div>`)
              }
            ]
          },
          {
            type: "compare",
            prompt: "Which desktop stack should power the offline research workspace?",
            cards: [
              { title: "Electron", tags: ["Fastest delivery"], markdown: "Chromium + Node with the broadest desktop plugin ecosystem.", markdownTooltip: "Lowest migration risk for a React team, but every app ships its own browser runtime." },
              { title: "Tauri", tags: ["Recommended"], markdown: "System webview + Rust core with the best size and memory balance.", markdownTooltip: "Keeps the existing interface while moving privileged desktop work into a small Rust core." },
              { title: "SwiftUI", tags: ["Native macOS"], markdown: "Native Apple stack with the strongest macOS integration." }
            ],
            criteria: [
              { title: "macOS and Windows", values: [{ status: "yes" }, { status: "yes" }, { status: "no", markdownTooltip: "A Windows release would require a second interface implementation." }] },
              { title: "Reuse the React interface", values: [{ status: "best" }, { markdown: "Most", status: "partial", markdownTooltip: "The React workspace carries over; native integrations move behind Rust commands." }, { status: "no" }] },
              { title: "Installer footprint", markdownTooltip: "Download size affects trial conversion and update friction.", values: [{ markdown: "~120 MB", status: "warning", markdownTooltip: "Chromium and Node ship with every application bundle." }, { markdown: "~12 MB", status: "best", markdownTooltip: "Uses the operating-system webview; only the **Rust core** ships with the app." }, { markdown: "~8 MB", status: "yes", markdownTooltip: "Native frameworks are provided by macOS." }] },
              { title: "Idle memory", values: [{ markdown: "~180 MB", status: "warning", markdownTooltip: "A dedicated Chromium process provides consistency at the cost of memory." }, { markdown: "~55 MB", status: "best", markdownTooltip: "The system webview and Rust process keep the baseline small." }, { markdown: "~45 MB", status: "yes" }] },
              { title: "Native integrations", markdownTooltip: "Menus, system services, notifications, and platform conventions.", values: [{ status: "partial" }, { status: "yes" }, { status: "best" }] },
              { title: "Auto-update maturity", values: [{ status: "best" }, { status: "partial", markdownTooltip: "The updater is production-ready but requires more signing and release plumbing." }, { status: "yes" }] },
              { title: "Team fit", values: ["TypeScript", "TypeScript + Rust", "Swift ramp-up"] },
              { title: "Estimated beta", values: ["5 weeks", "7 weeks", "10 weeks"] }
            ]
          },
          {
            type: "categorize",
            prompt: "Place each product capability in the release sequence.",
            categories: ["Ship in beta", "Next release", "Later"],
            cards: [
              { title: "Unified source inbox", tags: ["Beta foundation"], markdown: "Import PDFs, saved web pages, and interview notes into one searchable queue with provenance and processing state.", markdownTooltip: "Start with PDF, web capture, and pasted notes; email and cloud-drive ingestion can follow.", htmlPreview: roadmapPreviews.inbox },
              { title: "Evidence board", markdown: "Pin exact passages into themes, connect supporting and conflicting evidence, and preserve every source link.", htmlPreview: roadmapPreviews.evidence },
              { title: "Citation-backed brief editor", tags: ["Beta proof point"], markdown: "Turn an outline into a polished brief while keeping each claim linked to its supporting passages.", htmlPreview: roadmapPreviews.brief },
              { title: "Review and approval queue", tags: ["Paid-team blocker"], markdown: "Assign a draft, resolve anchored comments, request changes, and record the final approval decision.", htmlPreview: roadmapPreviews.review },
              { title: "Continuous source monitoring", markdown: "Watch saved searches, feeds, and selected sites for new material that changes an active research question.", markdownTooltip: "A first release could batch findings into a daily review queue instead of interrupting users with individual alerts." },
              { title: "Workspace roles and audit log", markdown: "Invite collaborators as viewers, editors, or workspace owners and retain a history of consequential changes." },
              { title: "Export packages", markdown: "Deliver a brief with its citation appendix as DOCX, PDF, or presentation-ready slides without rebuilding the evidence trail." },
              { title: "Public API and webhooks", tags: ["High integration cost"], markdown: "Automate source ingestion, query approved findings, and notify downstream systems when a brief changes state.", markdownTooltip: "Read-only access and outbound webhooks can ship before write APIs and third-party OAuth apps." }
            ]
          },
          {
            type: "flow",
            prompt: "Review and correct the trial-to-paid journey.",
            connections: [
              { from: "Start trial", to: "Import own sources", label: "ready" },
              { from: "Start trial", to: "Explore sample project", label: "not ready" },
              { from: "Import own sources", to: "Create first synthesis" },
              { from: "Explore sample project", to: "Create first synthesis" },
              { from: "Create first synthesis", to: "Save a view", label: "personal value" },
              { from: "Create first synthesis", to: "Invite teammate", label: "team value" },
              { from: "Save a view", to: "Receive weekly brief" },
              { from: "Invite teammate", to: "Discuss an insight" },
              { from: "Discuss an insight", to: "Receive weekly brief" },
              { from: "Receive weekly brief", to: "Upgrade", label: "day 10" }
            ]
          }
        ]
      });

      window.addEventListener("keydown", (event) => {
        if (event.key.toLowerCase() !== "t") return;
        const target = document.querySelector('.ih-evaluation-detail-button[data-detail-title="12 MB"]');
        target?.dispatchEvent(new MouseEvent("mouseover", { bubbles: true }));
      });

    </script>
  </body>
</html>
